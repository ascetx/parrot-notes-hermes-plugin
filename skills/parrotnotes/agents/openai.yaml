interface:
  display_name: "ParrotNotes"
  short_description: "Find, summarize, and save insights for your ParrotNotes recordings and notes"
  default_prompt: "Summarize my most recent ParrotNotes recording and list the action items"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "parrotnotes"
      description: "ParrotNotes connector for the user's notes, recordings, labels, and insights"
      transport: "streamable_http"
      url: "https://mcp.parrotnotes.app/mcp"
